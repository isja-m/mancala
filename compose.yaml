services:
  mancala-client:
    build:
      context: ./client
    depends_on:
      - mancala-backend
    environment:
      NODE_ENV: development
    ports:
      - 5173:5173
    develop:
      watch:
        - path: ./client/package.json
          action: rebuild
        - path: ./client
          target: /usr/src/client
          action: sync

  mancala-backend:
    build:
      context: ./backend
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: development
    ports:
      - 8080:8080

  neo4j:
    container_name: db
    image: neo4j:5.26.1
    hostname: db
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      NEO4J_AUTH: neo4j/sogyopassword
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./neo4j_db/data:/data
      - ./neo4j_db/logs:/logs
      - ./neo4j_db/conf:/conf
      - ./neo4j_db/import:/import
      - ./neo4j_db/plugins:/plugins
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 2s
      timeout: 120s
      retries: 20
      start_period: 3s
