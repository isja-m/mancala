image: gradle:8.12-jdk-alpine

stages:
    - test-stage
    - coverage-check-stage
    - build-stage

variables:
    MIN_COVERAGE: 80

build-backend:
    stage: build-stage
    script:
        - cd backend/api
        - gradle build

