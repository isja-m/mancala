image: gradle:8.12-jdk-alpine

before_script:
    - ': before_script'
    - chmod +x ./gradlew
    - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
    - test-stage
    - build-stage

build-backend:
    stage: build-stage
    script:
        - cd backend/api
        - gradle build

run-unittests:
    stage: test-stage 
    script:
        - cd backend/api
        - gradle test

test-coverage:
    stage: test-stage
    script:
        - cd backend
        - ': script'
        - ./gradlew check
        - cat api/build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>'
    coverage: '/Total.*?([0-9]{1,3})%/'
    artifacts:
        paths:
            - api/build/jacocoHtml/**
        # reports:
        #     junit:
        #         - "**/api/build/test-results/test/TEST-*.xml"
        expire_in: 1 hour
