image: gradle:8.12-jdk-alpine

stages:
    - test-stage
    - coverage-check-stage
    - build-stage
    - checkstyle-stage

variables:
    MIN_COVERAGE: 60

#### TEST STAGE ####
run-unittests:
    stage: test-stage 
    script:
        - cd backend/api
        - gradle test

api-test-coverage:
    stage: test-stage
    script:
        - cd backend/api
        - ': script'
        - chmod +x ../gradlew
        - ../gradlew check
        - cat build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>'
    coverage: '/Total.*?([0-9]{1,3})%/'
    artifacts:
        paths:
            - backend/api/build/jacocoHtml/index.html

domain-test-coverage:
    stage: test-stage
    script:
        - cd backend/domain
        - ': script'
        - chmod +x ../gradlew
        - ../gradlew check
        - cat build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>'
    coverage: '/Total.*?([0-9]{1,3})%/'
    artifacts:
        paths:
            - backend/domain/build/jacocoHtml/index.html

persistence-test-coverage:
    stage: test-stage
    script:
        - cd backend/persistence
        - ': script'
        - chmod +x ../gradlew
        - ../gradlew check
        - cat build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>'
    coverage: '/Total.*?([0-9]{1,3})%/'
    artifacts:
        paths:
            - backend/persistence/build/jacocoHtml/index.html

#### COVERAGE CHECK STAGE ####
min-api-coverage-test:
    stage: coverage-check-stage
    script:
        - apiCoverage=$(cat backend/api/build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>' | grep -o 'Total.*[0-9]*%' | grep -o '[0-9]*%<' | grep -o '[0-9]*')
        - if [ "$apiCoverage" -lt "$MIN_COVERAGE" ] ; then echo "$apiCoverage% of code coverage below threshold of $MIN_COVERAGE%" && exit 1 ; else exit 0 ; fi


min-domain-coverage-test:
    stage: coverage-check-stage
    script:
        - domainCoverage=$(cat backend/domain/build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>' | grep -o 'Total.*[0-9]*%' | grep -o '[0-9]*')
        - if [ "$domainCoverage" -lt "$MIN_COVERAGE" ] ; then echo "$domainCoverage% of code coverage below threshold of $MIN_COVERAGE%" && exit 1 ; else exit 0 ; fi

min-persistence-coverage-test:
    stage: coverage-check-stage
    script:
        - persistenceCoverage=$(cat backend/persistence/build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>' | grep -o 'Total.*[0-9]*%' | grep -o '[0-9]*')
        - if [ "$presistenceCoverage" -lt "$MIN_COVERAGE" ] ; then echo "$persistenceCoverage% of code coverage below threshold of $MIN_COVERAGE%" && exit 1 ; else exit 0 ; fi

#### BUILD STAGE ####
build-backend:
    stage: build-stage
    script:
        - cd backend/api
        - gradle build

#### CHECKSTYLE STAGE ####
checkstyle:
    stage: checkstyle-stage
    script:
        - cd backend
        - gradle checkstyleMain
