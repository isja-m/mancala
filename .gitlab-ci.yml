image: gradle:8.12-jdk-alpine

stages:
    - test-stage
    - build-stage

build-backend:
    stage: build-stage
    script:
        - cd backend/api
        - gradle build

run-unittests:
    stage: test-stage 
    script:
        - cd backend/api
        - gradle test

api-test-coverage:
    stage: test-stage
    script:
        - cd backend
        - ': script'
        - chmod +x ./gradlew
        - ./gradlew check
        # - cat api/build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>'
    coverage: '/Total.*?([0-9]{1,3})%/'
    # artifacts:
    #     paths:
    #         - api/build/jacocoHtml/**
    #     expire_in: 1 hour
