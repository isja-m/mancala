min-api-coverage-test:
  stage: coverage-check-stage
    script:
        - cd backend/api
        - ': script'
        - chmod +x ../gradlew
        - ../gradlew check
        - api-coverage=$(cat build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>' | grep -o 'Total.*[0-9]*%' | grep -o '[0-9]*%<' | grep -o '[0-9]*')
        - echo $api-coverage
        - if (( $(echo "$api-coverage < $MIN_COVERAGE" |bc -l) )) ; then echo "$api-coverage% of code coverage below threshold of $MIN_COVERAGE%" && exit 1 ; else exit 0 ; fi


min-domain-coverage-test:
    stage: coverage-check-stage
    script:
        - cd backend/domain
        - ': script'
        - chmod +x ../gradlew
        - ../gradlew check
        - domain-coverage=$(cat build/jacocoHtml/index.html | grep -o '<tfoot>.*</tfoot>' | grep -o 'Total.*[0-9]*%' | grep -o '[0-9]*%<' | grep -o '[0-9]*')
